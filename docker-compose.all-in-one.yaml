services:
  postgres:
    image: postgres:16-alpine
    container_name: replacement-desk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: replacement_desk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: replacement-desk-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/replacement_desk}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      AUTH_SECRET: ${AUTH_SECRET:-tbc-kart-default-secure-auth-secret-key-min-32-chars}
      UPLOAD_DIR: /app/uploads
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_PRINTING_CHAT_ID: ${TELEGRAM_PRINTING_CHAT_ID:-}
      TELEGRAM_PACKING_CHAT_ID: ${TELEGRAM_PACKING_CHAT_ID:-}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${PORT:-3000}:3000"

volumes:
  postgres_data:
  uploads_data:
