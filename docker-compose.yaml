services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: replacement-desk-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:-tbc-kart-default-secure-auth-secret-key-min-32-chars}
      UPLOAD_DIR: /app/uploads
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_PRINTING_CHAT_ID: ${TELEGRAM_PRINTING_CHAT_ID:-}
      TELEGRAM_PACKING_CHAT_ID: ${TELEGRAM_PACKING_CHAT_ID:-}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${PORT:-3000}:3000"

volumes:
  uploads_data:
